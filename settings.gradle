pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // JitPack: a Concentus (pure Java Opus codec) onnan érhető el
        // hivatalosan, mert a Maven Central-on a `org.concentus:Concentus`
        // artifact nem publikus.
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "SchoolLive"
include ':app'
