plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'hu.schoollive.player'
    compileSdk 34

    defaultConfig {
        applicationId "hu.schoollive.player"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "2.0.0"

        /*
         * A BACKEND ALAP-URL-JE – FELÜLÍRHATÓ A BUILDBŐL.
         *
         * Eddig fordítási idejű konstans volt (ProvisioningActivity.SERVER_URL),
         * tehát egy tesztszerverre irányított build forráskód-módosítást
         * igényelt. Ugyanaz a minta, mint az ESP32 firmware-nél
         * (platformio.ini [env:esp32dev-test] → -DBACKEND_BASE_URL=...).
         *
         *   ./gradlew assembleDebug -PslBaseUrl=https://test.schoollive.hu
         *
         * Megadás nélkül az ÉLES cím marad, tehát a CI és a kiadási build
         * változatlan. A tanúsítvány nem akadály: az app minden hálózati útja
         * a trust-all OkHttp kliensen megy (ApiClient, SyncClient,
         * BellSoundStore), a MediaPlayer pedig csak helyi fájlt játszik.
         *
         * ⚠️ ISKOLÁBA SOHA NE MENJEN teszt-URL-lel fordított build.
         */
        buildConfigField "String", "SERVER_URL",
            "\"${project.findProperty('slBaseUrl') ?: 'https://api.schoollive.hu'}\""
    }

    androidResources {
        /*
         * AZ .opus ERŐFORRÁST NEM SZABAD TÖMÖRÍTENI.
         *
         * A gyári default csengetőhangok a res/raw-ban vannak, és a lejátszó
         * `openRawResourceFd()`-del nyitja őket – az TÖMÖRÍTETT erőforrásnál
         * null-t ad. Az aapt alapértelmezett "ne tömörítsd" listáján az .mp3
         * rajta van, az .opus viszont nem garantáltan: enélkül a formátum-
         * váltás után a VÉGSŐ TARTALÉK csengetés maradna néma.
         *
         * (A BellAudioPlayer emellett tartalék ágat is kapott erre az esetre –
         * ez a beállítás az első védővonal, az a második.)
         */
        noCompress 'opus'
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Aláírás a workflow-ban történik apksigner-rel
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // WorkManager – periodikus háttérfeladat az OTA frissítés-ellenőrzéshez.
    // A `PlayerService` indításkor (10 s után) egyszer is megnézi a GitHub
    // Releases-t, de a 24/7 üzemelő eszközöknél az induláskori check sosem
    // futna újra; ezért WorkManager-rel 6 óránként újra ellenőrizzük az új
    // verziót (NETWORK_CONNECTED constraint, unique work policy=KEEP, hogy
    // szolgáltatás-újraindításkor ne dobja el a már ütemezett munkát).
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'org.mindrot:jbcrypt:0.4'

    // Opus codec dekódolás a snapcast streamhez. Concentus = pure Java port
    // a libopus-ból, NDK / natív lib nélkül. A backend a snapserver-en
    // `codec=opus&bitrate=192&chunk_ms=20` beállítást használja, így a
    // snapcast kliensnek Opus-t kell tudnia dekódolni (PCM helyett).
    // JitPack: https://github.com/lostromb/concentus
    // master-SNAPSHOT mindig a legfrissebb master commit-ra mutat;
    // ha reprodukálható build kell, cseréld konkrét commit hash-re,
    // pl. `com.github.lostromb:concentus:6c2328dc19`.
    implementation 'com.github.lostromb:concentus:master-SNAPSHOT'
}